apiVersion: v1
kind: ConfigMap
metadata:
  name: newstart-config
  namespace: newstart
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080,http://localhost"
  USER_SERVICE_URL: "http://user-service:3000"
  OPPORTUNITY_SERVICE_URL: "http://opportunity-service:3001"
  CHECKLIST_SERVICE_URL: "http://checklist-service:3002"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3003"
  WORKER_ENABLED: "true"
  QUEUE_SKIP_LOCKED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: newstart
type: Opaque
stringData:
  POSTGRES_USER: newstart
  POSTGRES_PASSWORD: newstart_dev_password
  POSTGRES_DB: newstart
---
apiVersion: v1
kind: Secret
metadata:
  name: newstart-db-urls
  namespace: newstart
type: Opaque
stringData:
  USER_DATABASE_URL: postgres://newstart:newstart_dev_password@postgres:5432/newstart_users
  OPPORTUNITY_DATABASE_URL: postgres://newstart:newstart_dev_password@postgres:5432/newstart_opportunities
  CHECKLIST_DATABASE_URL: postgres://newstart:newstart_dev_password@postgres:5432/newstart_checklists
  NOTIFICATION_DATABASE_URL: postgres://newstart:newstart_dev_password@postgres:5432/newstart_notifications
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: newstart
data:
  init-databases.sql: |
    SELECT 'CREATE DATABASE newstart_users'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'newstart_users')\gexec

    SELECT 'CREATE DATABASE newstart_opportunities'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'newstart_opportunities')\gexec

    SELECT 'CREATE DATABASE newstart_checklists'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'newstart_checklists')\gexec

    SELECT 'CREATE DATABASE newstart_notifications'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'newstart_notifications')\gexec
