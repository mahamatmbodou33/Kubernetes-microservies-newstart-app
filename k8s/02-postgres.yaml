apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: newstart
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432, name: postgres}]
          envFrom:
            - secretRef: {name: postgres-credentials}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d}
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 500m}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "newstart"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "newstart"]}
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - {name: initdb, configMap: {name: postgres-init}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: newstart
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
