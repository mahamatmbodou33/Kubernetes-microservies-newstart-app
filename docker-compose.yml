# NewStart — local development environment.
#   docker compose up --build
#
# Brings up PostgreSQL, the four backend services (each runs its own migrations on
# start), the API gateway and the frontend. Services talk to each other by service
# name, mirroring the eventual Kubernetes setup. This file is for LOCAL DEV ONLY.

name: newstart

x-postgres-creds: &postgres-creds
  POSTGRES_USER: ${POSTGRES_USER:-newstart}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newstart_dev_password}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *postgres-creds
      POSTGRES_DB: newstart
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates one database per service on first startup.
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-newstart}']
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: user-service
        SERVICE_PORT: '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-newstart}:${POSTGRES_PASSWORD:-newstart_dev_password}@postgres:5432/newstart_users
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - '3010:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  opportunity-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: opportunity-service
        SERVICE_PORT: '3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-newstart}:${POSTGRES_PASSWORD:-newstart_dev_password}@postgres:5432/newstart_opportunities
      USER_SERVICE_URL: http://user-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  checklist-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: checklist-service
        SERVICE_PORT: '3002'
    environment:
      NODE_ENV: production
      PORT: '3002'
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-newstart}:${POSTGRES_PASSWORD:-newstart_dev_password}@postgres:5432/newstart_checklists
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: notification-service
        SERVICE_PORT: '3003'
    environment:
      NODE_ENV: production
      PORT: '3003'
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-newstart}:${POSTGRES_PASSWORD:-newstart_dev_password}@postgres:5432/newstart_notifications
      WORKER_ENABLED: 'true'
      QUEUE_SKIP_LOCKED: 'true'
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '8080'
      LOG_LEVEL: info
      USER_SERVICE_URL: http://user-service:3000
      OPPORTUNITY_SERVICE_URL: http://opportunity-service:3001
      CHECKLIST_SERVICE_URL: http://checklist-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - '8080:8080'
    depends_on:
      - user-service
      - opportunity-service
      - checklist-service
      - notification-service
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked in at build time — the browser calls the gateway on the host.
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - '5173:8080'
    depends_on:
      - api-gateway
    restart: on-failure

volumes:
  postgres-data:
